<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1280px;
        height: 560px;
        overflow: hidden;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #f2f6ea;
        background:
          radial-gradient(900px 500px at 85% 120%, #3c6a4b55, transparent 60%),
          radial-gradient(700px 420px at 0% -10%, #d9e7a81c, transparent 60%),
          #1f3529;
        position: relative;
      }
      .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 46px; font-weight: 650; letter-spacing: -2px; }
      .brand svg { width: 44px; height: 44px; color: #d9e7a8; }
      .brand .dot { color: #d7e3a4; }
      .tag { display: inline-flex; align-self: flex-start; margin-top: 30px; padding: 6px 12px; border-radius: 999px; background: #ffffff12; border: 1px solid #d9e7a833; color: #cfdcab; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
      h1 { margin-top: 18px; font-size: 50px; line-height: 1.08; letter-spacing: -2px; font-weight: 560; }
      h1 em { font-style: normal; color: #d9e7a8; }
      p { margin-top: 20px; font-size: 18px; line-height: 1.55; color: #b4c4a8; max-width: 470px; }
      .shot { position: absolute; left: 640px; top: 64px; width: 860px; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 80px #0b160f99, 0 0 0 1px #ffffff1c; transform: perspective(1600px) rotateY(-9deg) rotateX(3deg); transform-origin: left center; }
      .shot img { display: block; width: 100%; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3" /><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4" /><path d="M5 21h14" /></svg>
        <span>rodeo<span class="dot">.</span></span>
      </div>
      <span class="tag">Gestión ganadera</span>
      <h1>Cada kilo cuenta.<br /><em>Cada decisión, también.</em></h1>
      <p>Pesadas del lector, lotes, costos y el momento justo para vender, en una sola app pensada para el campo.</p>
    </div>
    <div class="shot"><img src="__SCREENSHOT__" alt="" /></div>
  </body>
</html>
